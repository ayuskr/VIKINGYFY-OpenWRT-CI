name: Honk IPQ60xx firmware

on:
  push:
    branches: [honk-nn6000v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honk-nn6000v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/honk-nn6000v1'
    name: Build ${{ matrix.device }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: link_nn6000-v1
            config: IPQ60XX-LINK-NN6000V1-NSS-USB-NOWIFI
          - device: zn_m2
            config: IPQ60XX-ZNM2-NSS-NOWIFI
    env:
      DEVICE: ${{ matrix.device }}
      WRT_CONFIG: ${{ matrix.config }}
      WRT_TARGET: qualcommax
      WRT_THEME: vantage
      WRT_NAME: OWRT
      WRT_IP: 192.168.10.1
      WRT_SSID: OWRT
      WRT_WORD: '12345678'
      WRT_PACKAGE: ''
      SOURCE_REV: f9b0ce7650fdcc7f4793256a3ae43c1132e2bc49
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix libfuse-dev
          curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh -o "$RUNNER_TEMP/immortalwrt-init.sh"
          sudo bash "$RUNNER_TEMP/immortalwrt-init.sh"
          sudo install -d -o "$USER" /mnt/build_wrt
          ln -s /mnt/build_wrt wrt
          mkdir -p diagnostics
          find Scripts -name '*.sh' -exec dos2unix {} + -exec chmod +x {} +
      - name: Fetch source and prepare configuration
        shell: bash
        run: |
          set -euo pipefail
          git -C wrt init
          git -C wrt fetch --depth=1 https://github.com/VIKINGYFY/immortalwrt.git "$SOURCE_REV"
          git -C wrt checkout --detach FETCH_HEAD
          test "$(git -C wrt rev-parse HEAD)" = "$SOURCE_REV"
          printf 'ci=%s\nsource=%s\n' "$GITHUB_SHA" "$SOURCE_REV" > diagnostics/build-info.txt
          cd wrt
          if [ -f scripts/projectsmirrors.json ]; then sed -i '/.cn\//d; /tencent/d; /aliyun/d' scripts/projectsmirrors.json; fi
          # This image does not need the video feed (including the Qt5 Kconfig cycle).
          sed -i -E '/^[[:space:]]*src-[^[:space:]]+[[:space:]]+video[[:space:]]/d' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Unregister only the unused LuCI package participating in the fwknopd cycle.
          find package/feeds -type l -name luci-app-fwknopd -print -delete
          (
            cd package
            # Honk does not use Nikki's mutually exclusive Mihomo variants or sing-box.
            sed -E '/^UPDATE_PACKAGE "nikki" /d; /^UPDATE_VERSION "sing-box"([[:space:]]|$)/d' \
              "$GITHUB_WORKSPACE/Scripts/Packages.sh" > "$RUNNER_TEMP/honk-packages.sh"
            bash "$RUNNER_TEMP/honk-packages.sh"
            "$GITHUB_WORKSPACE/Scripts/Handles.sh"
          )
          cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" > .config
          "$GITHUB_WORKSPACE/Scripts/Settings.sh"
          sed -i -E '/^(# )?CONFIG_PACKAGE_(mosdns|luci-app-mosdns|honk|luci-app-honk|dnsmasq-full)(=| is not set)/d' .config
          cat "$GITHUB_WORKSPACE/Config/HONK-PACKAGES.txt" >> .config
          # TARGET_DEVICE_* is the multi-profile selection. For a single device,
          # select the actual target choice; Kconfig derives TARGET_PROFILE from it.
          sed -i -E '/^(# )?CONFIG_TARGET_(MULTI_PROFILE|ALL_PROFILES|PER_DEVICE_ROOTFS|PROFILE|(DEVICE_)?qualcommax_ipq60xx_DEVICE_[^= ]+)(=| is not set)/d' .config
          printf '# CONFIG_TARGET_MULTI_PROFILE is not set\nCONFIG_TARGET_qualcommax_ipq60xx_DEVICE_%s=y\n' "$DEVICE" >> .config
      - name: Validate Honk firmware configuration
        shell: bash
        working-directory: wrt
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/diagnostics/defconfig.log"
          rc=0
          make defconfig 2>&1 | tee "$log" || rc=$?
          if [ -f .config ]; then cp .config "$GITHUB_WORKSPACE/diagnostics/openwrt-config.txt"; fi
          if (( rc != 0 )) || grep -qi 'recursive dependency detected' "$log"; then
            echo '::error::Kconfig failed or reported a recursive dependency; firmware build skipped. See defconfig.log.'
            exit 1
          fi

          required=(
            "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_$DEVICE"
            CONFIG_PACKAGE_honk
            CONFIG_PACKAGE_luci-app-honk
            CONFIG_PACKAGE_dnsmasq-full
            CONFIG_KERNEL_DEBUG_INFO_BTF
          )
          failed=0
          for symbol in "${required[@]}"; do
            if grep -Fxq -- "${symbol}=y" .config; then
              printf 'OK: %s=y\n' "$symbol"
            else
              echo "::error file=wrt/.config::${symbol} must be set to y"
              failed=1
            fi
          done
          if ! grep -Fxq "CONFIG_TARGET_PROFILE=\"DEVICE_$DEVICE\"" .config || grep -Fxq 'CONFIG_TARGET_MULTI_PROFILE=y' .config; then
            echo "::error file=wrt/.config::Expected the single-device $DEVICE profile."
            grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|MULTI_PROFILE|.*DEVICE_.*)=' .config || true
            failed=1
          fi
          if grep -E '^CONFIG_PACKAGE_(mosdns|luci-app-mosdns|daed|daed-router|luci-app-daed-router)=[ym]$' .config; then
            echo '::error file=wrt/.config::mosdns or daed was unexpectedly selected.'
            failed=1
          fi
          if [[ "$DEVICE" == zn_m2 ]] && grep -E '^CONFIG_PACKAGE_(docker|dockerd|containerd|runc|tini|cgroupfs-mount|luci-app-dockerman|luci-i18n-dockerman-[^ =]+)=[ym]$' .config; then
            echo '::error file=wrt/.config::Docker packages must be disabled for ZN M2.'
            failed=1
          fi
          if [ -e package/base-files/files/usr/bin/daed ]; then
            echo '::error::Found an injected daed binary in base-files.'
            failed=1
          fi
          if (( failed )); then
            exit 1
          fi
      - name: Download packages
        shell: bash
        working-directory: wrt
        run: make download -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/download.log"
      - name: Compile firmware
        shell: bash
        working-directory: wrt
        run: |
          if ! make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/build-parallel.log"; then
            make -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/build-retry.log"
          fi
      - name: Verify and stage test images
        run: |
          shopt -s nullglob
          target=wrt/bin/targets/qualcommax/ipq60xx
          manifests=("$target"/*"$DEVICE"*.manifest)
          images=("$target"/*"$DEVICE"*sysupgrade*)
          ((${#manifests[@]} > 0 && ${#images[@]} > 0))
          for manifest in "${manifests[@]}"; do
            for pkg in honk luci-app-honk dnsmasq-full; do grep -E "^$pkg - " "$manifest"; done
            if grep -E '^(mosdns|luci-app-mosdns|daed|daed-router|luci-app-daed-router) - ' "$manifest"; then exit 1; fi
            if [[ "$DEVICE" == zn_m2 ]] && grep -E '^(docker|dockerd|containerd|runc|tini|cgroupfs-mount|luci-app-dockerman|luci-i18n-dockerman-[^ =]+) - ' "$manifest"; then exit 1; fi
          done
          mkdir -p test-firmware
          cp "${images[@]}" "${manifests[@]}" diagnostics/openwrt-config.txt diagnostics/build-info.txt test-firmware/
          (cd test-firmware && sha256sum -- * > SHA256SUMS)
      - name: Collect kernel and image diagnostics
        if: always()
        run: |
          mkdir -p diagnostics/kernel-configs
          if [ -d wrt/build_dir ]; then
            while IFS= read -r file; do
              dest="diagnostics/kernel-configs/${file#wrt/}.txt"
              mkdir -p "$(dirname "$dest")"
              cp "$file" "$dest"
            done < <(find wrt/build_dir -type f -path '*/linux-*/linux-*/.config')
            find wrt/build_dir -type f -name '*.itb' -printf '%s\t%p\n' > diagnostics/fit-sizes.tsv
          fi
          if [ -d wrt/bin/targets ]; then find wrt/bin/targets -type f -printf '%s\t%p\n' > diagnostics/image-sizes.tsv; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honk-${{ matrix.device }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 14
      - name: Upload test firmware
        uses: actions/upload-artifact@v4
        with:
          name: honk-${{ matrix.device }}-firmware-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-firmware/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish firmware to Releases
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: honk-*-firmware-${{ github.run_id }}-${{ github.run_attempt }}
          path: firmware
      - name: Publish verified images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for device in link_nn6000-v1 zn_m2; do
            source="firmware/honk-${device}-firmware-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            (cd "$source" && sha256sum -c SHA256SUMS)
            cp "$source"/*sysupgrade* "$source"/*.manifest release/
            cp "$source/openwrt-config.txt" "release/$device.config.txt"
            cp "$source/build-info.txt" "release/$device.build-info.txt"
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          tag="honk-firmware-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Honk firmware | NN6000 v1 & ZN M2 | $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --notes "Use the sysupgrade image matching your exact device. ZN M2 omits Docker and Dockerman. Verify downloads using SHA256SUMS." \
            release/*
